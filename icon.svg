<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App icon: a clock face whose ring doubles as a progress arc.
       Square and opaque on purpose — iOS masks its own rounded corners over
       the top, and puts black behind anything transparent. -->
  <rect width="1024" height="1024" fill="#F7F4EE"/>
  <g fill="none" stroke-linecap="round">
    <!-- the face -->
    <circle cx="512" cy="512" r="380" stroke="#E2C4CA" stroke-width="44"/>
    <!-- elapsed, from 12 o'clock clockwise to 4 -->
    <path d="M512 132 A380 380 0 0 1 841 702" stroke="#9E3A46" stroke-width="44"/>
    <!-- quarter marks -->
    <g stroke="#E2C4CA" stroke-width="24">
      <path d="M512 250 V300"/>
      <path d="M774 512 H724"/>
      <path d="M512 774 V724"/>
      <path d="M250 512 H300"/>
    </g>
    <!-- hands, drawn as one stroke so the corner joins cleanly -->
    <path d="M512 340 V600 H350" stroke="#9E3A46" stroke-width="54" stroke-linejoin="round"/>
  </g>
</svg>
