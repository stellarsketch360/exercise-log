<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>エクササイズ ─ Daily Training Log</title>
<style>
  :root{
    --house:#F7F4EE; --card:#FFFFFF; --line:#E6DFD3;
    --red:#9E3A46; --red2:#842F39; --ink:#2B2622; --dim:#8A8178;
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--house);color:var(--ink);font-family:var(--sans);
    min-height:100vh;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:600px;margin:0 auto;padding:28px 18px 110px;}
  .cue{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);}
  h1{font-family:var(--serif);font-size:30px;letter-spacing:.04em;margin:2px 0 0;font-weight:500;}
  .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;}
  .ico{background:none;border:1px solid var(--line);color:var(--dim);width:40px;height:40px;
    border-radius:10px;display:grid;place-items:center;cursor:pointer;}
  .ico:hover{border-color:var(--red);color:var(--red);}
  .ico.dots{border-radius:50%;gap:5px;grid-auto-flow:column;}
  .ico.dots i{width:4px;height:4px;border-radius:50%;background:currentColor;}
  .tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin-bottom:24px;}
  .tab{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    background:none;border:none;color:var(--dim);padding:0 0 12px;cursor:pointer;position:relative;
    white-space:nowrap;}
  .tab.on{color:var(--ink);}
  .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--red);}
  .sec{margin-bottom:26px;}
  .lbl{margin-bottom:10px;}
  .row{display:flex;gap:12px;}
  input[type=date],input[type=time],input[type=text],input[type=number],textarea{
    width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:11px 12px;font-family:var(--sans);font-size:14px;outline:none;}
  input:focus,textarea:focus{border-color:var(--red);}
  input[type=date],input[type=time],input[type=number]{font-family:var(--mono);}
  textarea{resize:vertical;min-height:70px;line-height:1.6;}
  .spot{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:16px;
    background-image:radial-gradient(130% 90% at 15% 0%,rgba(158,58,70,.07),transparent 62%);
    box-shadow:0 1px 2px rgba(43,38,34,.04);}
  .fline{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .ftext{font-family:var(--serif);font-size:17px;line-height:1.6;border-left:2px solid var(--red);
    padding-left:12px;flex:1;}
  .fx{background:none;border:none;color:var(--dim);cursor:pointer;padding:2px;font-size:16px;line-height:1;}
  .fx:hover{color:var(--red);}
  .empty{font-family:var(--serif);font-size:15px;color:var(--dim);font-style:italic;
    border-left:2px solid var(--line);padding-left:12px;margin-bottom:14px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .chip{font-size:12.5px;background:var(--house);border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:6px 12px;cursor:pointer;}
  .chip:hover{border-color:var(--red);color:var(--ink);}
  .chip.on{background:rgba(158,58,70,.10);border-color:var(--red);color:var(--red);}
  .addrow{display:flex;gap:8px;}
  .add{background:var(--red);color:#fff;border:none;border-radius:10px;padding:0 16px;
    font-family:var(--mono);font-size:12px;cursor:pointer;white-space:nowrap;}
  .add:hover{background:var(--red2);}
  .ex{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);}
  .exrow{padding:13px 14px;border-bottom:1px solid var(--line);}
  .exrow:last-child{border-bottom:none;}
  .exrow.done{background:rgba(158,58,70,.04);}
  .exhead{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .box{width:22px;height:22px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;
    display:grid;place-items:center;color:transparent;font-size:13px;font-weight:700;}
  .box.on{background:var(--red);border-color:var(--red);color:#fff;}
  .exname{flex:1;font-size:14.5px;}
  .feelrow{display:flex;align-items:center;gap:16px;}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:99px;
    background:var(--line);outline:none;padding:0;border:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:var(--red);cursor:pointer;border:3px solid var(--house);box-shadow:0 0 0 1px var(--red);}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--red);
    cursor:pointer;border:3px solid var(--house);}
  .feelval{font-family:var(--serif);font-size:26px;color:var(--red);min-width:62px;text-align:right;}
  .feelval span{font-family:var(--mono);font-size:12px;color:var(--dim);}
  .savebar{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--house) 62%,transparent);}
  .save{max-width:600px;margin:0 auto;display:block;width:100%;background:var(--red);color:#fff;
    border:none;border-radius:12px;padding:15px;font-family:var(--mono);font-size:13px;
    letter-spacing:.14em;text-transform:uppercase;cursor:pointer;font-weight:600;}
  .save:hover{background:var(--red2);}
  .save:disabled{background:var(--line);color:var(--dim);cursor:default;}
  .sub{display:flex;gap:18px;margin-bottom:20px;flex-wrap:wrap;}
  .subbtn{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    background:none;border:none;color:var(--dim);cursor:pointer;padding:4px 0;border-bottom:2px solid transparent;}
  .subbtn.on{color:var(--red);border-bottom-color:var(--red);}
  .card{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:var(--card);overflow:hidden;}
  .ctop{padding:14px;cursor:pointer;}
  .cmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;}
  .date{font-family:var(--mono);font-size:12px;}
  .badge{font-family:var(--mono);font-size:11px;color:var(--red);}
  .count{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap;}
  .cfocus{font-family:var(--serif);font-size:15px;line-height:1.55;border-left:2px solid var(--red);
    padding-left:11px;margin:3px 0;}
  .cbody{padding:0 14px 14px;border-top:1px solid var(--line);}
  .item{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13px;color:var(--dim);}
  .item.d{color:var(--ink);}
  .tick{width:15px;height:15px;border-radius:4px;border:1px solid var(--line);flex:0 0 auto;
    display:grid;place-items:center;color:transparent;font-size:9px;font-weight:700;}
  .tick.d{background:var(--red);border-color:var(--red);color:#fff;}
  .inote{font-family:var(--mono);font-size:11px;color:var(--dim);margin:-2px 0 4px 24px;}
  .cmt{font-size:13px;line-height:1.65;margin-top:12px;border-top:1px dashed var(--line);
    padding-top:12px;white-space:pre-wrap;}
  .statwrap{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--card);}
  .big{font-family:var(--serif);font-size:34px;color:var(--red);line-height:1;}
  .big span{font-size:14px;color:var(--dim);font-family:var(--mono);}
  .bar{margin-top:14px;}
  .barlbl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;}
  .barlbl b{font-family:var(--mono);color:var(--dim);font-weight:400;}
  .track{height:7px;background:var(--house);border-radius:99px;overflow:hidden;}
  .fill{height:100%;background:var(--red);border-radius:99px;transition:width .4s;}
  .eff{border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:10px;background:var(--card);}
  .efftop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;}
  .efftext{font-family:var(--serif);font-size:15px;border-left:2px solid var(--red);padding-left:10px;flex:1;}
  .effdiff{font-family:var(--mono);font-size:16px;white-space:nowrap;color:var(--dim);}
  .effdiff.pos{color:var(--red);}
  .effmeta{font-family:var(--mono);font-size:10.5px;color:var(--dim);}
  .small{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-bottom:14px;}
  .cmtcard{border-left:2px solid var(--red);background:var(--card);border-radius:0 10px 10px 0;
    padding:13px 14px;margin-bottom:11px;border-top:1px solid var(--line);
    border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
  .cmtdate{font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:7px;}
  .cmttext{font-size:13.5px;line-height:1.65;white-space:pre-wrap;}
  .blank{text-align:center;color:var(--dim);font-family:var(--serif);font-style:italic;
    font-size:15px;line-height:1.7;padding:48px 20px;}
  .scrim{position:fixed;inset:0;background:rgba(43,38,34,.40);display:flex;align-items:flex-end;
    justify-content:center;z-index:50;}
  .sheet{background:var(--house);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;
    max-width:600px;max-height:86vh;overflow-y:auto;padding:20px 18px 40px;}
  .sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .sheettitle{font-family:var(--serif);font-size:20px;}
  .mlist{display:flex;flex-direction:column;gap:8px;margin:10px 0 14px;}
  .mrow{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
    border-radius:9px;padding:8px 10px;}
  .mname{flex:1;font-size:13.5px;}
  .mname.s{font-family:var(--serif);font-size:14px;}
  .mname.cur{color:var(--red);}
  .mi{background:none;border:none;color:var(--dim);cursor:pointer;padding:4px 6px;font-size:14px;line-height:1;}
  .mi:hover{color:var(--red);}
  .mi.on{color:var(--red);}
  .ghost{margin-top:10px;width:100%;background:none;border:1px solid var(--line);color:var(--dim);
    border-radius:9px;padding:11px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;cursor:pointer;}
  .ghost:hover{border-color:var(--red);color:var(--red);}
  .ghost.sm{margin-top:0;width:auto;padding:7px 14px;}
  .setcard{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card);
    overflow:hidden;transition:border-color .2s;}
  .setcard.on{border-color:var(--red);}
  .sethead{display:flex;align-items:center;gap:11px;padding:15px 16px;cursor:pointer;}
  .setchev{flex:0 0 auto;width:8px;height:8px;border-right:1.5px solid var(--dim);
    border-bottom:1.5px solid var(--dim);transform:rotate(-45deg);margin-left:2px;
    transition:transform .28s ease;}
  .setcard.open .setchev{transform:rotate(45deg);}
  .setcard.on .setchev{border-color:var(--red);}
  .setname{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .setcard.on .setname{color:var(--red);}
  .setmeta{flex:0 0 auto;font-family:var(--mono);font-size:11px;color:var(--dim);}
  /* Kept in the DOM while folded so unfolding can animate. */
  .setbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease;}
  .setcard.open .setbody{grid-template-rows:1fr;}
  .setinner{overflow:hidden;min-height:0;}
  .setpad{padding:0 14px 16px;}
  .setrename{margin-bottom:12px;}
  .setcard input.setrename{width:100%;font-size:13px;}
  .setdel{width:100%;margin-top:14px;}
  .edrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--house);}
  .edrow.off{opacity:.5;}
  .edtop{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  /* input[type=…] outranks a bare class, so these have to be as specific. */
  .edrow input.edname{width:100%;min-width:0;flex:1;}
  .edtime{display:flex;align-items:center;gap:5px;}
  .edtime span{font-family:var(--mono);font-size:11px;color:var(--dim);flex:0 0 auto;}
  .edrow input.ednum{width:58px;min-width:0;flex:0 0 auto;text-align:center;padding:9px 4px;}
  .edtime .mi{flex:0 0 auto;padding:4px 2px;}
  .edtime .sp{flex:1 1 auto;}
  .ghost.next{margin-top:22px;border-color:var(--red);color:var(--red);}
  .ghost.next:hover{background:var(--red);color:#fff;}
  .ghost.danger{margin-top:28px;color:var(--red);border-color:var(--line);}
  .ghost.danger:hover{background:var(--red);border-color:var(--red);color:#fff;}
  .cedit{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;text-align:right;}
  .editbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card);border:1px solid var(--red);border-radius:9px;padding:10px 12px;
    margin-bottom:18px;font-family:var(--mono);font-size:11px;color:var(--red);}
  .toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;
    font-family:var(--mono);font-size:12px;padding:10px 18px;border-radius:99px;z-index:60;
    box-shadow:0 4px 14px rgba(43,38,34,.2);}
  .warn{background:#FBF3E7;border:1px solid #E8D6B8;color:#7A5B22;border-radius:9px;padding:10px 12px;
    font-size:12px;line-height:1.6;margin-bottom:18px;font-family:var(--mono);}
  .acct{display:flex;align-items:center;font-family:var(--mono);font-size:12px;color:var(--ink);
    background:var(--house);border:1px solid var(--line);border-radius:9px;padding:11px 12px;
    margin-bottom:8px;word-break:break-all;}
  .syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dim);margin-right:6px;flex:0 0 auto;}
  .syncdot.on{background:#3f8a52;}
  .tsum{font-family:var(--mono);font-size:11px;color:var(--dim);margin:14px 0 4px;text-align:right;}
  .tseg{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
    text-align:center;margin-top:8px;}
  .tcount{font-family:var(--serif);font-size:60px;color:var(--red);line-height:1;text-align:center;
    margin:20px 0 4px;font-variant-numeric:tabular-nums;}
  .tbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:18px 0;}
  .tbarfill{height:100%;background:var(--red);border-radius:99px;transition:width .2s linear;}
  .tnext{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;}
  .trow{display:flex;gap:10px;margin-top:20px;}
  .tbtn{flex:1;border-radius:12px;padding:14px;font-family:var(--mono);font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border:none;}
  .tbtn.main{background:var(--red);color:#fff;}
  .tbtn.sub{background:none;border:1px solid var(--line);color:var(--dim);}
  .tbtn.sub:hover{border-color:var(--red);color:var(--red);}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>エクササイズ</h1>
    </div>
    <button class="ico dots" id="gear" aria-label="設定"><i></i><i></i><i></i></button>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="focus">1 意識</button>
    <button class="tab" data-tab="timer">2 タイマー</button>
    <button class="tab" data-tab="record">3 記録</button>
    <button class="tab" data-tab="review">まとめ</button>
  </div>
  <div id="view"></div>
</div>
<div class="savebar" id="savebar">
  <button class="save" id="saveBtn" disabled>記録を保存</button>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function(){
"use strict";

/* ---------- firebase (fill these in from the Firebase console → project settings) ---------- */
var firebaseConfig = {
  apiKey: "AIzaSyB5nUTFJMsg7o_HtqePduk5WF8yYzbLP2c",
  authDomain: "exercise-log-8c450.firebaseapp.com",
  projectId: "exercise-log-8c450",
  storageBucket: "exercise-log-8c450.firebasestorage.app",
  messagingSenderId: "544048989758",
  appId: "1:544048989758:web:a8a1dab99f6bb73c9ab36f"
};
var fbReady = firebaseConfig.apiKey.indexOf("YOUR_") !== 0;
var db=null, uidRef=null, synced=false, syncError="";
var authUser=null, authBusy=false, authError="", unsubs=[], pendingCarry=null, syncPrimed=false, signingOut=false;

/* ---------- storage (localStorage + memory fallback, used as offline cache) ---------- */
var mem={}, canStore=true;
try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }catch(e){ canStore=false; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
/* Falls back to a copy, never the DEF_* array itself — otherwise editing a
   list on a fresh install would mutate the defaults it was seeded from. */
function load(k,d){ try{ var v=canStore?localStorage.getItem(k):mem[k]; return v?JSON.parse(v):clone(d); }catch(e){ return clone(d); } }
function save(k,v){ try{ var s=JSON.stringify(v); if(canStore)localStorage.setItem(k,s); else mem[k]=s; }catch(e){} }

/* ---------- defaults ---------- */
var DEF_ITEMS=[
  {id:"i_test",name:"15秒のテスト",sec:15},
  {id:"i_chair",name:"椅子",sec:600},
  {id:"i_solo",name:"個人",sec:300}
];
var DEF_PRE=[
  {id:"p1",text:"オープン",pinned:false},
  {id:"p2",text:"周りを見る",pinned:false},
  {id:"p3",text:"いつもと違う動きをする",pinned:false}
];
function normItems(list){
  return (list||[]).map(function(t){
    var sec = t.sec!=null ? t.sec : (t.min!=null ? Math.round(t.min*60) : 300);
    return {id:t.id,name:t.name,sec:sec};
  });
}
/* Earlier versions kept the menu (no durations) and the timer list apart.
   They are one list now, so fold the old pair together on first run. */
function loadItems(){
  var saved=load("act:items",null);
  if(saved) return normItems(saved);
  var tm=normItems(load("act:timers",null)||[]);
  var ex=load("act:exercises",null)||[];
  if(!tm.length && !ex.length) return clone(DEF_ITEMS);
  var out=tm.slice();
  ex.forEach(function(e){
    /* 椅子 and 椅子エクササイズ are the same thing; keep only one row. */
    var dup=out.some(function(o){
      return o.name===e.name || o.name.indexOf(e.name)>=0 || e.name.indexOf(o.name)>=0;
    });
    if(!dup) out.push({id:e.id,name:e.name,sec:300});
  });
  return out;
}
function normSets(list){
  return (list||[]).map(function(s){
    return {id:s.id||uid(),name:s.name||"セット",items:normItems(s.items)};
  });
}
/* There used to be a single list of items. It becomes セット1 so that nothing
   is lost when sets arrive. */
function loadSets(){
  var saved=load("act:sets",null);
  if(saved) return normSets(saved);
  return [{id:"set1",name:"セット1",items:loadItems()}];
}

/* ---------- state ---------- */
var sets=loadSets();
var presets=load("act:presets",DEF_PRE);
var sessions=load("act:sessions",[]);
var sel=load("act:sel",{});
/* Which set today is being run from, and which one is unfolded on screen. */
var activeSetId=load("act:activeSet",null);
if(!setById(activeSetId)) activeSetId = sets.length ? sets[0].id : null;
var openSetId=activeSetId;
var tab="focus", sub="history", expanded=null, editingId=null, preEditDraft=null;
var timerRunning=false, timerPaused=false, timerIndex=-1,
    timerRemaining=0, timerEndAt=0, timerHandle=null, timerRunQueue=[], audioCtx=null, audioUnlocked=false,
    timerPrecounting=false, preCount=0, preCountHandle=null,
    speechReady=false, speakHandle=null;
var ALARM_TYPES=[
  {id:"bell",name:"ベル"},
  {id:"clear",name:"クリアベル"},
  {id:"crystal",name:"クリスタル"}
];
var alarmType=load("act:alarm","bell");
/* Older builds stored alarm ids that no longer exist; fall back to the bell. */
if(!ALARM_TYPES.some(function(a){ return a.id===alarmType; })) alarmType="bell";
var draft=restoreDraft();

var cloudHandle=null;
/* Local save is immediate; the cloud write waits so that typing a name does
   not fire one request per keystroke. */
function persist(){
  save("act:sets",sets); save("act:presets",presets); save("act:sessions",sessions);
  save("act:sel",sel); save("act:activeSet",activeSetId);
  if(!uidRef) return;
  clearTimeout(cloudHandle);
  cloudHandle=setTimeout(flushCloud,500);
}
function flushCloud(){
  clearTimeout(cloudHandle); cloudHandle=null;
  /* Never before the first snapshot: right after a sign-in the local copy is
     still the old account's and would overwrite the one being joined. */
  if(uidRef && syncPrimed) db.collection("users").doc(uidRef).set({sets:sets,presets:presets},{merge:true});
}
function cloudSaveSession(s){ if(uidRef) db.collection("users").doc(uidRef).collection("sessions").doc(s.id).set(s); }
function cloudDeleteSession(id){ if(uidRef) db.collection("users").doc(uidRef).collection("sessions").doc(id).delete(); }
function cloudDeleteAllSessions(){
  if(!uidRef) return;
  var col=db.collection("users").doc(uidRef).collection("sessions");
  col.get().then(function(qs){ var batch=db.batch(); qs.forEach(function(d){ batch.delete(d.ref); }); batch.commit(); });
}
function cloudAddSessions(list){
  if(!uidRef) return;
  var col=db.collection("users").doc(uidRef).collection("sessions");
  var batch=db.batch(); list.forEach(function(s){ batch.set(col.doc(s.id), s); }); batch.commit();
}

function uid(){ return Math.random().toString(36).slice(2,9); }
function pad(n){ return (n<10?"0":"")+n; }
function fmtDur(sec){
  if(sec<60) return sec+"秒";
  var hh=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  if(hh) return hh+"時間"+(m?m+"分":"")+(s?s+"秒":"");
  return s ? m+"分"+s+"秒" : m+"分";
}
/* Long segments need the hour field; short ones stay as mm:ss. */
function fmtClock(sec){
  var hh=Math.floor(sec/3600);
  var body=pad(Math.floor(sec%3600/60))+":"+pad(sec%60);
  return hh ? hh+":"+body : body;
}
function today(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function now(){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function fmt(s){ var p=s.split("-"); return p[0]+"."+p[1]+"."+p[2]; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function toast(m){ var t=document.getElementById("toast");
  t.innerHTML='<div class="toast">'+esc(m)+'</div>';
  setTimeout(function(){ t.innerHTML=""; },1700); }

/* ---------- firebase sync ---------- */
/* Without this the app just sits on 同期中… forever when the Firebase
   project is reachable but not set up, giving no hint as to why. */
function syncFailed(e){
  var c=(e&&e.code)||"";
  syncError = c.indexOf("permission-denied")>=0 ? "Firestoreのセキュリティルールに拒否されました。"
    : c.indexOf("unauthenticated")>=0 ? "匿名ログインが有効になっていません。"
    : c.indexOf("not-found")>=0 ? "Firestoreデータベースが作成されていません。"
    : c.indexOf("unavailable")>=0 ? "Firebaseに接続できません。"
    : "同期に失敗しました。"+(c?"（"+c+"）":"");
  render();
}
/* Signing in swaps one account for another, so the previous account's
   listeners have to be dropped or both would write into the view. */
function stopSync(){
  unsubs.forEach(function(f){ try{ f(); }catch(e){} });
  unsubs=[];
}
function startSync(u){
  if(uidRef===u) return;
  stopSync();
  uidRef=u; syncPrimed=false; synced=false; syncError="";
  var userDoc=db.collection("users").doc(u);
  userDoc.get().then(function(snap){
    if(!snap.exists){
      /* A brand new account (first launch, or a first sign-in that made one)
         starts as a copy of whatever this device already had. */
      userDoc.set({sets:sets,presets:presets});
      if(sessions.length) cloudAddSessions(sessions);
    }
    if(pendingCarry && pendingCarry.length){ cloudAddSessions(pendingCarry); }
    pendingCarry=null;
  }).catch(syncFailed);
  unsubs.push(userDoc.onSnapshot(function(snap){
    syncPrimed=true;
    if(!snap.exists) return;
    var d=snap.data();
    /* d.items is the flat list older builds wrote, d.timers the one before
       that; either becomes a single set. */
    var nextSets = d.sets ? normSets(d.sets)
      : (d.items || d.timers) ? [{id:"set1",name:"セット1",items:normItems(d.items||d.timers)}]
      : sets;
    var nextPresets = d.presets || presets;
    /* Our own writes echo back here. Re-rendering on those would rebuild the
       view under the user and drop the caret mid-edit. */
    var changed = JSON.stringify(nextSets)!==JSON.stringify(sets)
      || JSON.stringify(nextPresets)!==JSON.stringify(presets);
    sets=nextSets; presets=nextPresets;
    if(!setById(activeSetId)) activeSetId = sets.length ? sets[0].id : null;
    if(!setById(openSetId)) openSetId = activeSetId;
    save("act:sets",sets); save("act:presets",presets); save("act:activeSet",activeSetId);
    if(changed) render();
  },syncFailed));
  unsubs.push(userDoc.collection("sessions").onSnapshot(function(qs){
    var list=[];
    qs.forEach(function(doc){ list.push(doc.data()); });
    list.sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?1:-1;
      return a.time<b.time?1:-1;
    });
    var changed = JSON.stringify(list)!==JSON.stringify(sessions) || !synced || syncError;
    sessions=list; save("act:sessions",sessions);
    synced=true; syncError="";
    if(changed) render();
  },syncFailed));
}

/* ---------- google sign-in (optional) ----------
   The app runs on an anonymous account from the first launch and never asks
   anyone to sign in. Signing in only *links* Google to that same anonymous
   account, so the uid — and with it every record — is untouched; what it buys
   is a way back in if this browser ever loses its storage. */
function googleProvider(){
  var p=new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({prompt:"select_account"});
  return p;
}
function authName(){
  return (authUser && !authUser.isAnonymous) ? (authUser.email||authUser.displayName||"Googleアカウント") : "";
}
function credFromError(e){
  if(e && e.credential) return e.credential;
  try{ return firebase.auth.GoogleAuthProvider.credentialFromError(e); }catch(err){ return null; }
}
function authDone(msg){
  authBusy=false; authError="";
  if(msg) toast(msg);
  render(); if(modal && modal.innerHTML) openSheet();
}
function authFailed(e){
  authBusy=false;
  var c=(e&&e.code)||"";
  authError = c.indexOf("popup-closed")>=0 || c.indexOf("cancelled-popup")>=0 ? ""
    : c.indexOf("operation-not-allowed")>=0 ? "FirebaseでGoogleログインが有効になっていません。"
    : c.indexOf("unauthorized-domain")>=0 ? "このドメインがFirebaseで許可されていません。"
    : "ログインできませんでした。"+(c?"（"+c+"）":"");
  render(); if(modal && modal.innerHTML) openSheet();
}
/* The Google account is already in use, i.e. it was signed into on another
   device. That account's records are the real ones; this device's anonymous
   pile is offered as something to carry across rather than silently dropped. */
function adoptExisting(e){
  var cred=credFromError(e);
  if(!cred) return authFailed(e);
  if(sessions.length && confirm("このGoogleアカウントには既に記録があります。\nこの端末の記録"+sessions.length+"件も持っていく？"))
    pendingCarry=sessions.slice();
  firebase.auth().signInWithCredential(cred)
    .then(function(){ authDone("ログインしました"); })
    .catch(authFailed);
}
function signInGoogle(){
  var u=firebase.auth().currentUser;
  if(!u || authBusy) return;
  authBusy=true; authError=""; openSheet();
  u.linkWithPopup(googleProvider())
    .then(function(){ authDone("Googleアカウントと繋がりました"); })
    .catch(function(e){
      var c=(e&&e.code)||"";
      if(c.indexOf("credential-already-in-use")>=0) return adoptExisting(e);
      /* Some browsers refuse popups outright; the redirect flow is the
         fallback and comes back through getRedirectResult on the next load. */
      if(c.indexOf("popup-blocked")>=0 || c.indexOf("operation-not-supported")>=0){
        u.linkWithRedirect(googleProvider()).catch(authFailed);
        return;
      }
      authFailed(e);
    });
}
function signOutGoogle(){
  if(!confirm("ログアウトする？\nこの端末の表示は空になるが、記録はGoogleアカウントに残っていて、次にログインすれば戻る。")) return;
  authBusy=true; signingOut=true; openSheet();
  firebase.auth().signOut().then(function(){
    /* Leave nothing behind locally, or the next anonymous account would be
       created as a copy of the account just left. Wiping has to finish before
       the replacement account exists, hence signingOut holding off the
       automatic one in onAuthStateChanged. */
    stopSync(); uidRef=null; synced=false;
    resetAll(); editingId=null; expanded=null;
    signingOut=false;
    return firebase.auth().signInAnonymously();
  }).then(function(){ authDone("ログアウトしました"); })
    .catch(function(e){ signingOut=false; authFailed(e); });
}

if(fbReady){
  firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();
  firebase.auth().onAuthStateChanged(function(user){
    authUser=user;
    if(user) startSync(user.uid);
    /* Signing out drops straight back to an anonymous account so the app
       keeps working without anybody logging in. */
    else if(!signingOut) firebase.auth().signInAnonymously().catch(syncFailed);
    render(); if(modal && modal.innerHTML) openSheet();
  });
  firebase.auth().getRedirectResult().then(function(r){
    if(r && r.user) toast("Googleアカウントと繋がりました");
  }).catch(function(e){
    var c=(e&&e.code)||"";
    if(c.indexOf("credential-already-in-use")>=0) return adoptExisting(e);
    if(c) authFailed(e);
  });
  firebase.auth().signInAnonymously().catch(syncFailed);
}

var TXT_BODY=["肩と首が張っていた。","体が軽かった。","寝不足で重だるい。","可動域が広く感じた。",
  "腰に少し違和感が残った。","温まるまで時間がかかった。","呼吸が深く入った。","脚に疲れが残っていた。",
  "体の軸が安定していた。","力みが抜けなかった。"];
var TXT_MIND=["落ち着いていた。","少し焦りがあった。","気持ちが乗らなかった。","静かな集中があった。",
  "不安が残ったままだった。","機嫌がよかった。","気が散りやすかった。","途中から楽しくなった。",
  "結果を気にしてしまった。","穏やかに始められた。"];
var TXT_THOUGHT=["考えが先に走っていた。","余計な判断をせずにいられた。","手順を追うことに集中しすぎた。",
  "途中で気づいて切り替えられた。","言葉にする前に体が動いた。","比較する気持ちが出た。",
  "ただ流れに乗れた。","意識することを決めずに始めていた。","迷いが少なかった。"];
var TXT_COMMENT=["途中で集中が切れた。","短時間でも整った。","終わったあと呼吸が楽になった。",
  "時間がなくて駆け足。","今日は無理せず軽めに。","久々に良い手応え。","夜にやると集中が散る。",
  "後半になって調子が上がった。"];

/* Builds a plausible history for testing. Uses the current exercise and
   preset lists rather than fixed names, so it stays valid after edits. */
function sample(days){
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function chance(p){ return Math.random()<p; }
  var base=new Date(), out=[], n=days||120;
  for(var b=n;b>=0;b--){
    if(!chance(0.6)) continue;               /* rest days leave natural gaps */
    var d=new Date(base); d.setDate(d.getDate()-b);
    /* Each day is run from one set, so pick one and record just its items. */
    var src=sets.length?sets[Math.floor(Math.random()*sets.length)]:null;
    var recItems=(src?src.items:[]).map(function(e){
      return {exId:e.id,name:e.name,done:chance(0.78)};
    });
    if(recItems.length && !recItems.some(function(i){ return i.done; })) recItems[0].done=true;
    var prog=n?(n-b)/n:1;                    /* drift upward so trends show */
    var feel=Math.max(35,Math.min(97,Math.round(52+prog*28+(Math.random()*24-12))));
    var focus=[], pool=presets.map(function(p){ return p.text; });
    var k=chance(0.25)?0:(chance(0.5)?1:2);
    while(focus.length<k && pool.length) focus.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    var hh=chance(0.2)?21+Math.floor(Math.random()*2):7+Math.floor(Math.random()*3);
    out.push({id:uid(),
      date:d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),
      time:pad(hh)+":"+pad(Math.floor(Math.random()*12)*5),
      feel:feel, focus:focus,
      comment:chance(0.4)?pick(TXT_COMMENT):"",
      body:chance(0.8)?pick(TXT_BODY):"",
      mind:chance(0.8)?pick(TXT_MIND):"",
      thought:chance(0.75)?pick(TXT_THOUGHT):"",
      items:recItems});
  }
  return out.reverse();                      /* newest first, as the app expects */
}

/* Puts every setting and the whole log back to a first-launch state. */
function resetAll(){
  clearInterval(timerHandle); timerHandle=null;
  clearInterval(preCountHandle); preCountHandle=null;
  timerRunning=false; timerPaused=false; timerPrecounting=false;
  timerIndex=-1; timerRunQueue=[];
  stopSpeech();
  sets=[{id:"set1",name:"セット1",items:clone(DEF_ITEMS)}];
  activeSetId=sets[0].id; openSetId=activeSetId;
  presets=clone(DEF_PRE); sel={};
  alarmType="bell"; save("act:alarm",alarmType);
  sessions=[]; expanded=null; editingId=null; preEditDraft=null;
  draft=blankDraft(); clearDraft(); clearTimerState();
  persist(); cloudDeleteAllSessions();
}

/* ---------- render ---------- */
var view=document.getElementById("view");
var savebar=document.getElementById("savebar");
var saveBtn=document.getElementById("saveBtn");

function setById(id){
  var m=(sets||[]).filter(function(s){ return s.id===id; });
  return m.length?m[0]:null;
}
function activeSet(){ return setById(activeSetId) || sets[0] || null; }
function activeItems(){ var s=activeSet(); return s?s.items:[]; }
function allItems(){
  var out=[];
  sets.forEach(function(s){ out=out.concat(s.items); });
  return out;
}
/* Unchecked items stay in the set — they are just not part of today. */
function isSel(id){ return sel[id]!==false; }
function selectedItems(){ return activeItems().filter(function(t){ return isSel(t.id); }); }
function blankDraft(){
  return {date:today(),time:now(),done:{},notes:{},focus:[],comment:"",
    body:"",mind:"",thought:"",feel:50};
}
/* The flow spans three screens with a workout in between, so an unsaved
   draft is kept on disk. Yesterday's leftovers are discarded. */
function saveDraft(){ if(!editingId) save("act:draft",draft); }
function clearDraft(){ save("act:draft",null); }
function restoreDraft(){
  var d=load("act:draft",null);
  return (d && d.date===today()) ? d : blankDraft();
}
function findSession(id){
  var m=sessions.filter(function(s){ return s.id===id; });
  return m.length?m[0]:null;
}
/* Today's menu is whatever is ticked on the timer screen. When editing an old
   record, show what it actually contained too — including items since removed
   or unticked — so saving cannot silently drop them. */
function menuItems(){
  var s=editingId?findSession(editingId):null;
  if(!s) return selectedItems();
  var list=s.items.map(function(i){ return {id:i.exId,name:i.name}; });
  selectedItems().forEach(function(t){
    if(!list.some(function(o){ return o.id===t.id; })) list.push(t);
  });
  return list;
}
function startEdit(id){
  var s=findSession(id);
  if(!s) return;
  if(!editingId) preEditDraft=draft;   /* keep the in-progress entry for later */
  editingId=id;
  var done={}, notes={};
  s.items.forEach(function(i){ done[i.exId]=!!i.done; if(i.note) notes[i.exId]=i.note; });
  draft={date:s.date,time:s.time,done:done,notes:notes,focus:(s.focus||[]).slice(),
    comment:s.comment||"",body:s.body||"",mind:s.mind||"",thought:s.thought||"",
    feel:typeof s.feel==="number"?s.feel:50};
  expanded=null; tab="record"; setTab(); render();
  window.scrollTo(0,0);
}
function cancelEdit(){
  var id=editingId;
  editingId=null; draft=preEditDraft||blankDraft(); preEditDraft=null;
  tab="review"; sub="history"; expanded=id;   /* return to the card you came from */
  setTab(); render();
}
function deleteEditing(){
  var id=editingId;
  if(!id || !confirm("この記録を削除する？元には戻せない。")) return;
  sessions=sessions.filter(function(s){ return s.id!==id; });
  editingId=null; expanded=null;
  draft=preEditDraft||blankDraft(); preEditDraft=null;
  persist(); cloudDeleteSession(id);
  tab="review"; sub="history"; setTab(); render();
  toast("記録を削除しました");
}
function hasContent(){
  var any=false; for(var k in draft.done){ if(draft.done[k]) any=true; }
  return any || draft.focus.length>0 || draft.comment.trim()!==""
    || draft.body.trim()!=="" || draft.mind.trim()!=="" || draft.thought.trim()!=="";
}

/* Identifies a field well enough to find its replacement after a rebuild. */
var FOCUS_ATTRS=["data-sname","data-iname","data-imin","data-isec"];
function focusKey(el){
  if(!el || !el.getAttribute) return null;
  for(var i=0;i<FOCUS_ATTRS.length;i++){
    var v=el.getAttribute(FOCUS_ATTRS[i]);
    if(v!=null) return "["+FOCUS_ATTRS[i]+'="'+v+'"]';
  }
  return el.id ? "#"+el.id : null;
}
function restoreFocus(key,s,e){
  if(!key) return;
  var el=view.querySelector(key);
  if(!el) return;
  el.focus();
  if(s!=null){ try{ el.setSelectionRange(s,e); }catch(err){} }
}

function render(){
  /* Firebase callbacks can fire before these elements are looked up below. */
  if(!view || !savebar) return;
  /* Rebuilding innerHTML destroys whatever is focused, so note where the
     caret was and put it back afterwards. */
  var ae=document.activeElement;
  var fkey=(ae && view.contains(ae)) ? focusKey(ae) : null;
  var fs=null, fe=null;
  if(fkey){ try{ fs=ae.selectionStart; fe=ae.selectionEnd; }catch(e){} }
  savebar.style.display = tab==="record" ? "block" : "none";
  document.getElementById("gear").style.visibility = tab==="review" ? "hidden" : "visible";
  view.innerHTML = tab==="focus" ? focusHTML() : tab==="record" ? recordHTML()
    : tab==="review" ? reviewHTML() : timerHTML();
  if(tab==="focus") bindFocus();
  else if(tab==="record"){
    bindRecord();
    saveBtn.textContent = editingId ? "記録を更新" : "記録を保存";
    /* An edit may legitimately clear every field, so allow saving an empty one. */
    saveBtn.disabled = editingId ? false : !hasContent();
  }
  else if(tab==="review") bindReview();
  else bindTimer();
  restoreFocus(fkey,fs,fe);
}

function statusHTML(){
  var h="";
  if(!canStore) h+='<div class="warn">このプレビューでは保存できません。HTMLファイルをブラウザで開けば記録は端末に保存されます。</div>';
  if(!fbReady) h+='<div class="warn">Firebase未設定：今はこの端末にのみ保存されています。設定すると全端末で同期されます。</div>';
  else if(syncError) h+='<div class="warn">'+esc(syncError)+'<br>記録はこの端末には保存されています。</div>';
  /* Nothing is shown once it is synced — only while it has yet to connect. */
  else if(!synced) h+='<div class="small"><span class="syncdot"></span>同期中…</div>';
  return h;
}
function focusEditorHTML(){
  var sorted=presets.slice().sort(function(a,b){ return (b.pinned?1:0)-(a.pinned?1:0); });
  var h='<div class="spot">';
  if(draft.focus.length){
    draft.focus.forEach(function(f){
      h+='<div class="fline"><div class="ftext">'+esc(f)+'</div>'
       + '<button class="fx" data-unfocus="'+esc(f)+'">✕</button></div>';
    });
  } else h+='<div class="empty">下の定型から選ぶか、新しく書き起こす。</div>';
  h+='<div class="chips">';
  sorted.forEach(function(p){
    var on=draft.focus.indexOf(p.text)>=0;
    h+='<button class="chip'+(on?" on":"")+'" data-focus="'+esc(p.text)+'">'+(p.pinned?"★ ":"")+esc(p.text)+'</button>';
  });
  h+='</div><div class="addrow"><input type="text" id="nf" placeholder="新しく書く…">'
   + '<button class="add" id="addF">＋ 追加</button></div></div>';
  return h;
}

/* Step 1 — decide what to hold in mind today. */
function focusHTML(){
  return statusHTML()
   + '<div class="sec"><div class="cue lbl">今日意識すること</div>'+focusEditorHTML()+'</div>'
   + '<button class="ghost next" id="toTimer">タイマーへ →</button>';
}

/* Step 3 — record how it went. */
function recordHTML(){
  var h="";
  if(editingId) h+='<div class="editbar"><span>'+fmt(draft.date)+' の記録を編集中</span>'
   + '<button class="fx" id="cancelEdit">やめる</button></div>';

  h+='<div class="sec"><div class="cue lbl">日時</div><div class="row">'
   + '<input type="date" id="d" value="'+draft.date+'">'
   + '<input type="time" id="t" value="'+draft.time+'" style="max-width:130px">'
   + '</div></div>';

  /* Editing an old record is self-contained, so the focus stays editable
     there; in the normal flow it was already set in step 1. */
  if(editingId){
    h+='<div class="sec"><div class="cue lbl">今日意識すること</div>'+focusEditorHTML()+'</div>';
  } else {
    h+='<div class="sec"><div class="cue lbl">今日意識すること</div>';
    if(draft.focus.length){
      draft.focus.forEach(function(f){ h+='<div class="fline"><div class="ftext">'+esc(f)+'</div></div>'; });
    } else h+='<div class="empty">まだ決めていない。</div>';
    h+='<button class="ghost sm" id="backFocus">意識することを変える</button></div>';
  }

  h+='<div class="sec"><div class="cue lbl">本日のメニュー</div><div class="ex">';
  menuItems().forEach(function(e){
    var on=!!draft.done[e.id];
    h+='<div class="exrow'+(on?" done":"")+'">'
     + '<div class="exhead" data-toggle="'+e.id+'"><div class="box'+(on?" on":"")+'">✓</div>'
     + '<div class="exname">'+esc(e.name)+'</div></div>'
     + '</div>';
  });
  h+='</div></div>';

  h+='<div class="sec"><div class="cue lbl">体の調子</div>'
   + '<textarea id="bd" placeholder="今の体の感覚…">'+esc(draft.body)+'</textarea></div>';
  h+='<div class="sec"><div class="cue lbl">心の調子</div>'
   + '<textarea id="md" placeholder="今の心の状態…">'+esc(draft.mind)+'</textarea></div>';
  h+='<div class="sec"><div class="cue lbl">思考の調子</div>'
   + '<textarea id="th" placeholder="今の思考の状態…">'+esc(draft.thought)+'</textarea></div>';
  h+='<div class="sec"><div class="cue lbl">全体の感想</div>'
   + '<textarea id="cm" placeholder="気づきなど…">'+esc(draft.comment)+'</textarea></div>';

  h+='<div class="sec"><div class="cue lbl">手応え</div><div class="feelrow">'

}
function bindRecord(){
  document.getElementById("d").onchange=function(){ draft.date=this.value; saveDraft(); };
  document.getElementById("t").onchange=function(){ draft.time=this.value; saveDraft(); };
  document.getElementById("bd").oninput=function(){ draft.body=this.value; saveBtn.disabled=!hasContent(); saveDraft(); };
  document.getElementById("md").oninput=function(){ draft.mind=this.value; saveBtn.disabled=!hasContent(); saveDraft(); };
  document.getElementById("th").oninput=function(){ draft.thought=this.value; saveBtn.disabled=!hasContent(); saveDraft(); };
  document.getElementById("cm").oninput=function(){ draft.comment=this.value; saveBtn.disabled=!hasContent(); saveDraft(); };

function toggleFocus(t){
  var i=draft.focus.indexOf(t);
  if(i>=0) draft.focus.splice(i,1); else draft.focus.push(t);
  saveDraft(); render();
}
function addFocus(){
  var el=document.getElementById("nf"); var t=el.value.trim();
  if(!t) return;
  if(!presets.some(function(p){ return p.text===t; })){
    presets.unshift({id:uid(),text:t,pinned:false}); persist();
  }
  if(draft.focus.indexOf(t)<0) draft.focus.push(t);
  el.value=""; saveDraft(); render();
}

saveBtn.onclick=function(){
  var recItems=menuItems().map(function(e){
    /* Per-item memos are no longer editable, but records written before that
       still carry one — write it back so editing an old record keeps it. */
    return {exId:e.id,name:e.name,done:!!draft.done[e.id],note:(draft.notes[e.id]||"").trim()};
  });
  var editing=!!editingId;
  var session={id:editingId||uid(),date:draft.date,time:draft.time,items:recItems,
    focus:draft.focus.slice(),comment:draft.comment.trim(),
    body:draft.body.trim(),mind:draft.mind.trim(),thought:draft.thought.trim(),feel:draft.feel};
  if(editing){
    /* The date may have moved, so restore newest-first order. */
    sessions=sessions.map(function(s){ return s.id===session.id?session:s; })
      .sort(function(a,b){ if(a.date!==b.date) return a.date<b.date?1:-1; return a.time<b.time?1:-1; });
  } else sessions.unshift(session);
  editingId=null;
  persist(); cloudSaveSession(session);
  if(editing){
    draft=preEditDraft||blankDraft(); preEditDraft=null;
    tab="review"; sub="history"; expanded=session.id; setTab();
  } else {
    draft=blankDraft(); clearDraft();
    tab="review"; sub="history"; expanded=session.id; setTab();
  }
  render(); toast(editing?"記録を更新しました":"記録を保存しました");
};

/* ---------- review ---------- */
function reviewHTML(){
  var h='<div class="sub">';
  [["history","履歴"],["stats","統計"],["effect","分析"],["comments","ふりかえり"]].forEach(function(x){
    h+='<button class="subbtn'+(sub===x[0]?" on":"")+'" data-sub="'+x[0]+'">'+x[1]+'</button>';
  });
  h+='</div>';

  if(sub==="history"){
    if(!sessions.length) return h+'<div class="blank">まだ記録がない。<br>「記録」で最初の一回を残そう。</div>';
    sessions.forEach(function(s){
      var dc=s.items.filter(function(i){ return i.done; }).length;
      var open=expanded===s.id;
      h+='<div class="card"><div class="ctop" data-exp="'+s.id+'"><div class="cmeta">'
       + '<span class="date">'+fmt(s.date)+' · '+s.time
       + (typeof s.feel==="number"?' <span class="badge">手応え '+s.feel+'%</span>':'')+'</span>'
       + '<span class="count">メニュー '+dc+'/'+s.items.length+' '+(open?"▲":"▼")+'</span></div>';
      s.focus.forEach(function(f){ h+='<div class="cfocus">'+esc(f)+'</div>'; });
      h+='</div>';
      if(open){
        h+='<div class="cbody">';
        s.items.forEach(function(i){
          h+='<div class="item'+(i.done?" d":"")+'"><span class="tick'+(i.done?" d":"")+'">✓</span>'+esc(i.name)+'</div>';
          if(i.note) h+='<div class="inote">↳ '+esc(i.note)+'</div>';
        });
        [["body","体"],["mind","心"],["thought","思考"],["comment","全体"]].forEach(function(f){
          if(s[f[0]]) h+='<div class="cmt"><span class="badge">'+f[1]+'</span> '+esc(s[f[0]])+'</div>';
        });
        h+='<div class="cedit"><button class="ghost sm" data-edit="'+s.id+'">この記録を編集</button></div>';
        h+='</div>';
      }
      h+='</div>';
    });
    return h;
  }

  if(sub==="stats"){
    if(!sessions.length) return h+'<div class="blank">記録が貯まると、ここに実施率が出る。</div>';
    var fs=sessions.filter(function(s){ return typeof s.feel==="number"; });
    h+='<div class="statwrap"><div class="cue" style="margin-bottom:6px">総トレーニング数</div>'
     + '<div class="big">'+sessions.length+'<span> sessions</span></div>';
    if(fs.length){
      var avg=Math.round(fs.reduce(function(a,s){ return a+s.feel; },0)/fs.length);
      h+='<div style="margin-top:16px"><div class="cue" style="margin-bottom:6px">平均手応え</div>'
       + '<div class="big">'+avg+'<span>%</span></div></div>';
    }
    h+='<div class="cue" style="margin:22px 0 4px">メニュー実施率</div>';
    allItems().forEach(function(e){
      var c=sessions.filter(function(s){
        return s.items.some(function(i){ return i.exId===e.id && i.done; }); }).length;
      var p=Math.round(c/sessions.length*100);
      h+='<div class="bar"><div class="barlbl"><span>'+esc(e.name)+'</span><b>'+p+'%</b></div>'
       + '<div class="track"><div class="fill" style="width:'+p+'%"></div></div></div>';
    });
    return h+'</div>';
  }

  if(sub==="effect"){
    var f2=sessions.filter(function(s){ return typeof s.feel==="number"; });
    if(f2.length<2) return h+'<div class="blank">手応え付きの記録が貯まると、<br>意識したことの「効き」が見えてくる。</div>';
    var texts=[]; f2.forEach(function(s){ s.focus.forEach(function(t){ if(texts.indexOf(t)<0) texts.push(t); }); });
    if(!texts.length) return h+'<div class="blank">意識したことを選んで記録すると、<br>ここに効きが並ぶ。</div>';
    function mean(a){ return a.length? a.reduce(function(x,s){ return x+s.feel; },0)/a.length : null; }
    var rows=texts.map(function(t){
      var w=f2.filter(function(s){ return s.focus.indexOf(t)>=0; });
      var o=f2.filter(function(s){ return s.focus.indexOf(t)<0; });
      var wm=mean(w), om=mean(o);
      return {t:t,n:w.length,wm:wm,diff:(wm!=null&&om!=null)?wm-om:null};
    }).sort(function(a,b){ return (b.diff==null?-999:b.diff)-(a.diff==null?-999:a.diff); });
    if(f2.length<5) h+='<div class="small">※ データが少ない（n='+f2.length+'）。傾向は参考程度に。</div>';
    rows.forEach(function(r){
      var d=r.diff==null?null:Math.round(r.diff);
      h+='<div class="eff"><div class="efftop"><div class="efftext">'+esc(r.t)+'</div>'
       + '<div class="effdiff'+(d!=null&&d>=0?" pos":"")+'">'+(d==null?"—":(d>=0?"+":"")+d)+'</div></div>'
       + '<div class="effmeta">意識した日の平均 '+(r.wm!=null?Math.round(r.wm):"—")+'% · n='+r.n
       + (d!=null?'　/　意識しない日との差 '+(d>=0?"+":"")+d+'pt':'')+'</div></div>';
    });
    return h;
  }

  var fields=[["body","体"],["mind","心"],["thought","思考"],["comment","全体"]];
  var wc=sessions.filter(function(s){
    return fields.some(function(f){ return s[f[0]]; });
  });
  if(!wc.length) return h+'<div class="blank">ふりかえりがまだない。</div>';
  wc.forEach(function(s){
    h+='<div class="cmtcard"><div class="cmtdate">'+fmt(s.date)+' · '+s.time+'</div>';
    fields.forEach(function(f){
      if(!s[f[0]]) return;
      h+='<div class="cmttext">'+(f[1]?'<span class="badge">'+f[1]+'</span> ':'')+esc(s[f[0]])+'</div>';
    });
    h+='</div>';
  });
  return h;
}

/* ---------- timer ---------- */
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    /* iOS 16.4+: play through the ringer/silent switch instead of being muted by it */
    try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
  }
  if(!audioCtx) return;
  /* A context is created in "suspended" state on iOS, so this must run on
     first creation too — not only on later calls. */
  if(audioCtx.state==="suspended"){ try{ audioCtx.resume(); }catch(e){} }
  /* iOS only truly unlocks output once a buffer has played inside a gesture. */
  if(!audioUnlocked){
    try{
      var b=audioCtx.createBufferSource();
      b.buffer=audioCtx.createBuffer(1,1,22050);
      b.connect(audioCtx.destination);
      b.start(0);
      audioUnlocked=true;
    }catch(e){}
  }
}
function tone(t0,off,freq,dur,wave,vol){
  var o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=wave||"sine"; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t0+off);
  g.gain.exponentialRampToValueAtTime(vol||0.35,t0+off+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+off+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0+off); o.stop(t0+off+dur+0.05);
}
/* A bell is a fundamental plus inharmonic partials that fade faster than it.
   parts entries are [frequency ratio, gain ratio, decay ratio]. */
function bell(t0,off,f,dur,vol,parts){
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    tone(t0,off,f*p[0],dur*p[2],"sine",vol*p[1]);
  }
}
function playBeep(type){
  if(!audioCtx) return;
  var a=type||alarmType, t0=audioCtx.currentTime;
  if(a==="clear"){
    bell(t0,0,880,1.3,0.3,[[1,1,1],[2,0.4,0.7],[3,0.15,0.5],[4.2,0.08,0.4]]);
  } else if(a==="crystal"){
    bell(t0,0,1174.66,1.6,0.22,[[1,1,1],[2,0.35,0.7],[2.7,0.2,0.55],[4,0.1,0.4]]);
  } else {
    /* bell — the original */
    tone(t0,0,659.25,0.9,"triangle",0.3); tone(t0,0,1318.5,0.9,"triangle",0.08);
  }
}
function playTick(){
  if(!audioCtx) return;
  tone(audioCtx.currentTime,0,600,0.08,"sine",0.2);
}

/* iOS will not speak unless the first utterance is issued from a gesture,
   so a muted one is queued up front to unlock it. */
function primeSpeech(){
  if(speechReady || !window.speechSynthesis) return;
  try{
    var u=new SpeechSynthesisUtterance(" ");
    u.volume=0; u.lang="ja-JP";
    window.speechSynthesis.speak(u);
    speechReady=true;
  }catch(e){}
}
function speak(text){
  if(!text || !window.speechSynthesis) return;
  try{
    var sy=window.speechSynthesis;
    if(sy.speaking||sy.pending) sy.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang="ja-JP"; u.rate=1; u.volume=1;
    sy.speak(u);
  }catch(e){}
}
/* Let the bell ring before the name is read out, rather than over it. */
function announce(text){
  clearTimeout(speakHandle);
  speakHandle=setTimeout(function(){ speak(text); },700);
}
function stopSpeech(){
  clearTimeout(speakHandle); speakHandle=null;
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
}

function itemById(id){
  var m=allItems().filter(function(t){ return t.id===id; });
  return m.length?m[0]:null;
}
function setOfItem(id){
  var m=sets.filter(function(s){ return s.items.some(function(t){ return t.id===id; }); });
  return m.length?m[0]:null;
}
function setItemSec(id,mins,secs){
  var t=itemById(id); if(!t) return;
  t.sec=Math.max(1,(mins|0)*60+(secs|0));
  persist();
}
/* Repaints only what a card's header shows, so tweaking a time inside an open
   set does not rebuild the inputs the user is working in. */
function refreshSetMeta(id){
  var s=setById(id), card=view.querySelector('[data-setcard="'+id+'"]');
  if(!s || !card) return;
  var n=s.items.filter(function(t){ return isSel(t.id); }).length;
  var meta=card.querySelector(".setmeta"), sum=card.querySelector(".tsum");
  var go=card.querySelector("[data-sstart]");
  if(meta) meta.textContent=n+"項目 · "+fmtDur(setSelDur(s));
  if(sum) sum.textContent="合計 "+fmtDur(setSelDur(s));
  if(go) go.disabled=setSelDur(s)===0;
}
function applySetOpen(){
  [].forEach.call(view.querySelectorAll("[data-setcard]"),function(el){
    var id=el.getAttribute("data-setcard");
    el.className="setcard"+(id===openSetId?" open":"")+(id===activeSetId?" on":"");
  });
}
function bindSets(){
  [].forEach.call(view.querySelectorAll("[data-setopen]"),function(el){
    el.onclick=function(){
      var id=el.getAttribute("data-setopen");
      /* Unfolding a set is also how you pick it for today. */
      if(openSetId===id) openSetId=null;
      else { openSetId=id; activeSetId=id; }
      persist(); applySetOpen();
    };
  });
  [].forEach.call(view.querySelectorAll("[data-sname]"),function(el){
    el.oninput=function(){
      var s=setById(el.getAttribute("data-sname"));
      if(!s) return;
      s.name=el.value; persist();
      var card=view.querySelector('[data-setcard="'+s.id+'"]');
      var lbl=card&&card.querySelector(".setname");
      if(lbl) lbl.textContent=s.name;
    };
  });
  [].forEach.call(view.querySelectorAll("[data-tsel]"),function(el){
    el.onclick=function(){
      var id=el.getAttribute("data-tsel");
      sel[id]=!isSel(id); persist();
      var on=isSel(id);
      el.className="box"+(on?" on":"");
      var row=el.parentNode.parentNode;
      row.className="edrow"+(on?"":" off");
      var s=setOfItem(id); if(s) refreshSetMeta(s.id);
    };
  });
  [].forEach.call(view.querySelectorAll("[data-iname]"),function(el){
    el.oninput=function(){ var t=itemById(el.getAttribute("data-iname"));
      if(t){ t.name=el.value; persist(); } };
  });
  function timeHandler(attr){
    return function(el){
      el.onchange=function(){
        var id=el.getAttribute(attr), mi=view.querySelector('[data-imin="'+id+'"]');
        var se=view.querySelector('[data-isec="'+id+'"]');
        setItemSec(id,+mi.value||0,+se.value||0);
        var s=setOfItem(id); if(s) refreshSetMeta(s.id);
      };
    };
  }
  [].forEach.call(view.querySelectorAll("[data-imin]"),timeHandler("data-imin"));
  [].forEach.call(view.querySelectorAll("[data-isec]"),timeHandler("data-isec"));
  function move(attr,step){
    return function(el){
      el.onclick=function(){
        var p=el.getAttribute(attr).split("|"), s=setById(p[0]), i=+p[1], j=i+step;
        if(!s || j<0 || j>=s.items.length) return;
        var a=s.items[j]; s.items[j]=s.items[i]; s.items[i]=a;
        persist(); render();
      };
    };
  }
  [].forEach.call(view.querySelectorAll("[data-iup]"),move("data-iup",-1));
  [].forEach.call(view.querySelectorAll("[data-idown]"),move("data-idown",1));
  [].forEach.call(view.querySelectorAll("[data-idel]"),function(el){
    el.onclick=function(){
      var id=el.getAttribute("data-idel"), t=itemById(id), s=setOfItem(id);
      if(!t || !s || !confirm("「"+t.name+"」を削除する？")) return;
      s.items=s.items.filter(function(x){ return x.id!==id; });
      delete sel[id]; persist(); render();
    };
  });
  [].forEach.call(view.querySelectorAll("[data-sadd]"),function(el){
    el.onclick=function(){
      var id=el.getAttribute("data-sadd"), s=setById(id);
      var n=view.querySelector('[data-nin="'+id+'"]'), m=view.querySelector('[data-nim="'+id+'"]');
      var v=n.value.trim(); if(!s || !v) return;
      s.items.push({id:uid(),name:v,sec:Math.max(1,Math.round((+m.value||1)*60))});
      n.value=""; m.value=""; persist(); render();
    };
  });
  [].forEach.call(view.querySelectorAll("[data-sstart]"),function(el){
    el.onclick=function(){
      activeSetId=el.getAttribute("data-sstart"); persist(); startTimer();
    };
  });
  [].forEach.call(view.querySelectorAll("[data-sdel]"),function(el){
    el.onclick=function(){
      var s=setById(el.getAttribute("data-sdel"));
      if(!s || !confirm("「"+s.name+"」を削除する？中の項目もなくなる。")) return;
      s.items.forEach(function(t){ delete sel[t.id]; });
      sets=sets.filter(function(x){ return x.id!==s.id; });
      if(activeSetId===s.id) activeSetId = sets.length?sets[0].id:null;
      if(openSetId===s.id) openSetId=activeSetId;
      persist(); render();
    };
  });
  var as=document.getElementById("addSet");
  if(as) as.onclick=function(){
    var s={id:uid(),name:"セット"+(sets.length+1),items:[]};
    sets.push(s); activeSetId=s.id; openSetId=s.id;
    persist(); render();
  };
}

/* iOS discards a backgrounded page, which used to lose a running timer
   entirely. The run is kept on disk and rebuilt from the wall clock. */
function saveTimerState(){
  if(!timerRunning){ clearTimerState(); return; }
  save("act:timer",{queue:timerRunQueue,index:timerIndex,endAt:timerEndAt,
    paused:timerPaused,remaining:timerRemaining});
}
function clearTimerState(){ save("act:timer",null); }
function restoreTimer(){
  var st=load("act:timer",null);
  if(!st || !st.queue || !st.queue.length) return;
  timerRunQueue=st.queue; timerIndex=st.index||0;
  if(st.paused){
    timerRunning=true; timerPaused=true; timerRemaining=st.remaining;
    tab="timer"; return;
  }
  /* Roll forward over whatever elapsed while the page was gone. */
  var end=st.endAt;
  while(timerIndex<timerRunQueue.length && end<=Date.now()){
    var f=timerRunQueue[timerIndex];
    if(f && f.id) draft.done[f.id]=true;
    timerIndex++;
    if(timerIndex<timerRunQueue.length) end+=timerRunQueue[timerIndex].total*1000;
  }
  if(timerIndex>=timerRunQueue.length){
    saveDraft(); clearTimerState();
    timerRunQueue=[]; timerIndex=-1; tab="record";   /* it finished while away */
    return;
  }
  saveDraft();
  timerRunning=true; timerPaused=false; timerEndAt=end;
  timerRemaining=Math.max(0,Math.round((end-Date.now())/1000));
  tab="timer";
  timerHandle=setInterval(tick,250);
}

function startTimer(){
  var list=selectedItems();
  if(!list.length) return;
  timerRunQueue=list.map(function(t){ return {id:t.id,name:t.name,total:t.sec}; });
  ensureAudio(); primeSpeech();
  timerPrecounting=true; preCount=5;
  playTick();
  clearInterval(preCountHandle); preCountHandle=setInterval(precountTick,1000);
  render();
}
function precountTick(){
  preCount--;
  if(preCount<0){
    clearInterval(preCountHandle); preCountHandle=null;
    timerPrecounting=false;
    beginRun();
    return;
  }
  ensureAudio(); playTick();
  if(tab==="timer") render();
}
function cancelPrecount(){
  clearInterval(preCountHandle); preCountHandle=null;
  timerPrecounting=false; timerRunQueue=[];
  stopSpeech();
  render();
}
function beginRun(){
  timerIndex=0; timerRemaining=timerRunQueue[0].total; timerPaused=false; timerRunning=true;
  timerEndAt=Date.now()+timerRemaining*1000;
  ensureAudio(); playBeep();
  announce(timerRunQueue[0].name);
  if(navigator.vibrate) navigator.vibrate(150);
  clearInterval(timerHandle); timerHandle=setInterval(tick,250);
  saveTimerState();
  render();
}
function tick(){
  if(!timerRunning || timerPaused) return;
  var rem=Math.max(0,Math.round((timerEndAt-Date.now())/1000));
  if(rem<=0){ advanceSegment(true); return; }
  timerRemaining=rem;
  if(tab==="timer") render();
}
function advanceSegment(playSound){
  if(playSound){
    ensureAudio(); playBeep();
    /* Finishing a segment ticks it off today's menu. Skipping does not. */
    var fin=timerRunQueue[timerIndex];
    if(fin && fin.id){ draft.done[fin.id]=true; saveDraft(); }
    if(navigator.vibrate) navigator.vibrate([250,120,250]);
  }
  if(timerIndex<timerRunQueue.length-1){
    timerIndex++; timerRemaining=timerRunQueue[timerIndex].total;
    timerEndAt=Date.now()+timerRemaining*1000; timerPaused=false;
    announce(timerRunQueue[timerIndex].name);
    clearInterval(timerHandle); timerHandle=setInterval(tick,250);
    saveTimerState();
    if(tab==="timer") render();
  } else {
    clearInterval(timerHandle); timerHandle=null;
    timerRunning=false; timerIndex=-1; timerRunQueue=[];
    clearTimerState();
    announce("終了");
    toast("タイマー終了");
    tab="record"; setTab(); render();   /* straight on to writing it up */
  }
}
function toggleTimerPause(){
  if(!timerPaused){
    timerPaused=true; clearInterval(timerHandle);
    timerRemaining=Math.max(0,Math.round((timerEndAt-Date.now())/1000));
  } else {
    timerPaused=false; timerEndAt=Date.now()+timerRemaining*1000;
    clearInterval(timerHandle); timerHandle=setInterval(tick,250);
  }
  saveTimerState();
  render();
}
function stopTimer(){
  clearInterval(timerHandle); timerHandle=null;
  timerRunning=false; timerPaused=false; timerIndex=-1; timerRunQueue=[];
  clearTimerState(); stopSpeech();
  render();
}

     + '<button class="mi'+(p.pinned?" on":"")+'" data-pin="'+p.id+'">★</button>'
     + '<button class="mi" data-delp="'+p.id+'">🗑</button></div>';

   + '<button class="add" id="addP">＋ 追加</button></div>';

  h+='<div class="cue" style="margin-top:24px">アラーム音</div><div class="mlist">';
  ALARM_TYPES.forEach(function(a){

  h+='</div>';

  if(fbReady){
    h+='<div class="cue" style="margin-top:24px">アカウント</div>';
    if(authError) h+='<div class="warn">'+esc(authError)+'</div>';
    if(authName()){
      h+='<div class="acct"><span class="syncdot on"></span>'+esc(authName())+'</div>'
       + '<div class="small">この記録はGoogleアカウントに紐づいています。別の端末でも同じアカウントでログインすれば開けます。</div>'
       + '<button class="ghost" id="signout"'+(authBusy?" disabled":"")+'>ログアウト</button>';
    } else {
      h+='<div class="small">今はこの端末にだけ紐づいています。'
       + 'Safariのデータを消すと記録に辿り着けなくなります。<br>'
       + 'ログインしなくてもこのまま使えます。</div>'
       + '<button class="ghost" id="signin"'+(authBusy?" disabled":"")+'>'

    }
  }

  h+='<div class="cue" style="margin-top:24px">データ</div>'
   + '<button class="ghost" id="demo">使い込んだふうにする（テスト用）</button>'
   + '<button class="ghost" id="reset">全てデフォルトに戻す（テスト用）</button>'
   + '<button class="ghost" id="wipe">記録をすべて消去</button>'
   + '</div></div>';
  modal.innerHTML=h;

  document.getElementById("scrim").onclick=function(e){ if(e.target.id==="scrim") close(); };
  document.getElementById("close").onclick=close;
  var si=document.getElementById("signin");

  var so=document.getElementById("signout");

      persist(); openSheet(); };

  [].forEach.call(modal.querySelectorAll("[data-delp]"),function(el){

    el.onclick=function(){ alarmType=el.getAttribute("data-selalarm"); save("act:alarm",alarmType);
      ensureAudio(); playBeep(alarmType); openSheet(); };

function close(){ modal.innerHTML=""; }

/* ---------- tabs ---------- */
function setTab(){
  [].forEach.call(document.querySelectorAll(".tab"),function(b){
    b.className="tab"+(b.getAttribute("data-tab")===tab?" on":"");
  });
}
[].forEach.call(document.querySelectorAll(".tab"),function(b){
  b.onclick=function(){ tab=b.getAttribute("data-tab"); setTab(); render(); };
});

restoreTimer();
setTab();

/* iOS unlocks audio only inside a real user gesture, and the alarm itself
   fires from a timer callback. Unlock on the first touch anywhere so the
   alarm can sound later. */
function unlockAudioOnce(){
  ensureAudio(); primeSpeech();
  if(audioCtx && audioCtx.state==="running"){
    document.removeEventListener("touchend",unlockAudioOnce,true);
    document.removeEventListener("click",unlockAudioOnce,true);
  }
}
document.addEventListener("touchend",unlockAudioOnce,true);
document.addEventListener("click",unlockAudioOnce,true);
/* Safari can suspend the context when the page is backgrounded. */
document.addEventListener("visibilitychange",function(){
  if(document.hidden){ if(cloudHandle) flushCloud(); return; }
  if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
});

render();
})();
