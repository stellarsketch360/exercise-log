# Publishes this branch to /preview/ on the same Pages site, so a change can be
# tried on a real phone without touching the live app at the root. keep_files
# stops the action from deleting anything already on gh-pages, and
# destination_dir keeps this build inside its own subdirectory.
name: Deploy preview

on:
  push:
    branches:
      - claude/branch-validity-discussion-ghywiz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages/preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: preview
          keep_files: true
          exclude_assets: '.github'
