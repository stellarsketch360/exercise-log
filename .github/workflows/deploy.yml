name: Deploy to GitHub Pages

# main is the only branch that publishes. It used to share that job with
# claude/exercise-app-status-dpv732, which is how main fell 58 commits behind
# what was actually live: the branch you get from a fresh clone was not the
# branch being deployed, so it read as current when it was not.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
